  # --- Consumo digital: pagamentos instantâneos (Pix) e penetração digital ---
  # Pix liquidado no SPI (BCB Olinda), série diária desde o lançamento do Pix (nov/2020),
  # agregada para meses-calendário completos. Quantidade e valor têm unidades distintas
