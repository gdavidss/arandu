sources:
  bcb_sgs:
    name: Sistema Gerenciador de Séries Temporais (SGS/BCData)
    institution: Banco Central do Brasil
    url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.{codigo_serie}/dados?formato=json
    license_or_terms: Open Data Commons Open Database License (ODbL), as listed in the BCB open-data portal
    notes: Official BCB time-series API. NFSP series are below-the-line and must not be mixed with RTN above-the-line series.
  tesouro_series:
    name: Séries Temporais do Tesouro Nacional
    institution: Secretaria do Tesouro Nacional
    url: https://series-temporais.tesouro.gov.br/backend-series-temporais/rest/Public/SerieGrafico
    license_or_terms: Tesouro Transparente public data terms / ODbL in CKAN metadata where listed
    notes: Official Tesouro Transparente public API used by the Tesouro time-series application.
  ibge_sidra:
    name: SIDRA / Serviço de Dados IBGE
    institution: Instituto Brasileiro de Geografia e Estatística
    url: https://servicodados.ibge.gov.br/api/v3/agregados
    license_or_terms: IBGE public API terms
    notes: Generic connector for selected SIDRA aggregate URLs.
  bcb_olinda_expectativas:
    name: Expectativas de Mercado (Focus) — Olinda OData
    institution: Banco Central do Brasil
    url: https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata
    license_or_terms: Open Data Commons Open Database License (ODbL), as listed in the BCB open-data portal
    notes: >-
      Public BCB Olinda OData service for the Focus survey. Distinct from SGS. Expectations
      are survey medians/means, forward-looking; do not mix with realized (trailing) prints.
  bcb_olinda_spi:
    name: Estatísticas do SPI — Sistema de Pagamentos Instantâneos (Pix)
    institution: Banco Central do Brasil
    url: https://olinda.bcb.gov.br/olinda/servico/SPI/versao/v1/odata/PixLiquidadosAtual
    license_or_terms: Open Data Commons Open Database License (ODbL), as listed in the BCB open-data portal
    notes: >-
      Public BCB Olinda OData service for the SPI, the settlement system behind Pix. The
      PixLiquidadosAtual resource is a daily series of Pix transactions settled in the SPI
      from Pix launch (2020-11). Pix is not published in SGS. Daily counts (Quantidade) and
      values (Total, R$ thousands) are aggregated to calendar months by this connector;
      count and value are different units and are kept as separate series.
  bcb_olinda_mpv:
    name: Estatísticas de Meios de Pagamentos — Olinda OData (MPV_DadosAbertos)
    institution: Banco Central do Brasil
    url: https://olinda.bcb.gov.br/olinda/servico/MPV_DadosAbertos/versao/v1/odata/
    license_or_terms: Open Data Commons Open Database License (ODbL), as listed in the BCB open-data portal
    notes: >-
      Public BCB Olinda OData service for retail payment-instrument statistics. The monthly
      resource MeiosdePagamentosMensalDA covers Pix, TED, boleto, cheque (and the now-extinct
      DOC/TEC) with quantidade (em milhares) and valor (R$ milhões) per instrument. The
      quarterly resource Quantidadeetransacoesdecartoes covers card transactions by função
      (crédito/débito/pré-pago). The MPV Pix figures include Pix settled both inside and
      outside the SPI, so they are a broader measure than the SPI-only series (bcb_olinda_spi)
      and must not be mixed with it in the same chart. Count and value are different units.
  bcb_olinda_pix:
    name: Estatísticas do Pix — Olinda OData (Pix_DadosAbertos)
    institution: Banco Central do Brasil
    url: https://olinda.bcb.gov.br/olinda/servico/Pix_DadosAbertos/versao/v1/odata/
    license_or_terms: Open Data Commons Open Database License (ODbL), as listed in the BCB open-data portal
    notes: >-
      Public BCB Olinda OData service with Pix statistics from the DICT (Diretório de
      Identificadores de Contas Transacionais — the Pix key directory). The
      PixUsuariosCadastradosDICT resource is a monthly end-of-month stock of users registered
      in the DICT, split into pessoa física, pessoa jurídica and total. This is a stock of
      registered users, a different concept from Pix transaction volume/value.
  comexstat:
    name: Comex Stat — Estatísticas de Comércio Exterior
    institution: Ministério do Desenvolvimento, Indústria, Comércio e Serviços (MDIC/SECEX)
    url: https://api-comexstat.mdic.gov.br/general
    license_or_terms: Dados abertos do Governo Federal (MDIC/SECEX), uso público
    notes: >-
      API pública POST/JSON do Comex Stat (SECEX/MDIC). Valores FOB em US$ (convertidos
      para US$ milhões neste projeto). Base SECEX por país de destino/origem; conceito
      distinto da balança comercial em base Balanço de Pagamentos do BCB (SGS 22707-22709).
  rfb_cnae:
    name: Arrecadação por Divisão Econômica da CNAE
    institution: Secretaria Especial da Receita Federal do Brasil (RFB)
    url: https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/dados-abertos/receitadata/arrecadacao/arrecadacao-por-divisao-economica-da-cnae
    license_or_terms: Dados abertos da Receita Federal (ReceitaData), uso público
    notes: >-
      Planilha XLSX de dados abertos da RFB com a receita administrada pela RFB por divisão
      econômica da CNAE, uma aba por ano (2011 em diante). Atualizada periodicamente pela RFB
      (o nome do arquivo carrega o último ano coberto). A divisão 92 ("Atividades de
      exploração de jogos de azar e apostas") capta o mercado regulado de apostas de quota
      fixa a partir de 2025, quando passou a incidir tributação federal sobre o setor. É
      tributo arrecadado das empresas (não o GGR nem o volume apostado). Não há série pública
      de GGR/volume de apostas em API estável (a SPA/MF publica apenas apresentações
      periódicas em PDF, e o SIGAP é uma API de envio de dados pelos operadores, não de
      consulta pública).
  bcb_estudo_apostas:
    name: Estudo Especial 119 — Análise técnica sobre o mercado de apostas online no Brasil
    institution: Banco Central do Brasil
    url: https://www.bcb.gov.br/conteudo/relatorioinflacao/EstudosEspeciais/EE119_Analise_tecnica_sobre_o_mercado_de_apostas_online_no_Brasil_e_o_perfil_dos_apostadores.pdf
    license_or_terms: Publicação oficial do Banco Central do Brasil (uso público com citação da fonte)
    notes: >-
      Estudo especial pontual (não é série temporal) publicado pelo BCB em 2024, com
      estimativas das transferências via Pix para empresas de jogos de azar e apostas em
      agosto de 2024 e o perfil dos apostadores. Os números aqui registrados são transcritos
      literalmente da tabela "Comparativo entre apostas online e loterias" (média mensal em
      2024, R$ bilhões) do estudo. Por ser um levantamento único, NÃO é atualizado pelo cron
      diário; o gráfico que o usa é rotulado como estimativa pontual de ago/2024. As
      estimativas de Pix→bets do BCB não constituem série mensal oficial e não devem ser
      transformadas em uma.
  spa_panorama:
    name: Panorama do mercado regulado de apostas de quota fixa
    institution: Secretaria de Prêmios e Apostas (SPA) — Ministério da Fazenda
    url: https://www.gov.br/fazenda/pt-br/composicao/orgaos/secretaria-de-premios-e-apostas
    license_or_terms: Apresentações oficiais da SPA/MF publicadas no portal gov.br (uso público com citação da fonte)
    notes: >-
      Apresentações periódicas (Panoramas) da SPA/MF com indicadores do mercado regulado de
      apostas de quota fixa: GGR, destinações legais (12%), CPFs únicos e contas ativas. São
      retratos acumulados de período (1º semestre/2025 e ano de 2025), publicados em PDF — NÃO
      há API/CSV/XLSX estável com série mensal. Por isso os números aqui são registrados como
      pontos de snapshot, transcritos literalmente das apresentações, e os gráficos que os
      usam são rotulados como acumulados de período (não série temporal atualizada pelo cron).
      Não existe série oficial de GGR/volume mensal em formato aberto e estável.
  lei_14790:
    name: Lei nº 14.790/2023 — destinação da arrecadação das apostas de quota fixa
    institution: Presidência da República (Casa Civil)
    url: https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14790.htm
    license_or_terms: Legislação federal, domínio público
    notes: >-
      Texto legal que define a destinação estatutária da parcela da arrecadação das apostas de
      quota fixa (Art. 30), repartida entre esporte, turismo, segurança pública, educação,
      seguridade social, saúde e demais. As fatias aqui registradas são os percentuais legais
      transcritos literalmente da lei (somam 100%). É a estrutura legal de alocação — não uma
      série temporal nem valores efetivamente executados.
  entain_market:
    name: Estimativa de mercado de apostas (Entain)
    institution: Entain plc (operadora de apostas) — estimativa de mercado
    url: https://www.infomoney.com.br/esportes/brasil-deve-terminar-2025-como-o-5o-maior-mercado-de-apostas-do-mundo/
    license_or_terms: Estimativa de mercado reportada pela imprensa; uso com citação da fonte
    notes: >-
      Estimativa do tamanho do mercado brasileiro de apostas em 2022, quando o setor ainda não
      era regulado: GGR (receita bruta de jogo) de US$ 1,5 bilhão, 10ª maior do mundo, segundo a
      Entain. Convertida para reais ao câmbio médio de 2022 (~R$ 5,16/US$): ~R$ 7,7 bi. É uma
      estimativa de operadora para o mercado não regulado — NÃO é número oficial nem série
      temporal; serve apenas como ponto de comparação histórico frente ao GGR oficial de 2025.
  ecb:
    name: Taxas de câmbio de referência do Banco Central Europeu (BCE)
    institution: European Central Bank (via Frankfurter)
    url: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html
    license_or_terms: ECB reference rates, uso público com citação da fonte
    notes: >-
      Taxas de câmbio de referência diárias (dias úteis) do BCE, acessadas pela API pública
      Frankfurter. Usadas para moedas que o BCB não publica em reais — em especial o iuan
      chinês (CNY): a PTAX do BCB cobre apenas ~10 moedas e o SGS não tem série BRL/CNY. A
      cotação aqui é a paridade direta (ex.: base CNY, símbolo BRL = R$ por iuan), derivada
      das taxas de referência do BCE; é referência de fechamento do BCE, não a PTAX do BCB.
  bti:
    name: Índice de Transformação Bertelsmann (BTI)
    institution: Bertelsmann Stiftung
    url: https://bti-project.org
    license_or_terms: Publicação da Bertelsmann Stiftung (uso público com citação da fonte)
    notes: >-
      Índice de Transformação Bertelsmann (BTI), publicado a cada dois anos (bienal) pela
      Bertelsmann Stiftung desde 2006. Pontuações em escala de 1 a 10 (10 = melhor) que
      avaliam, por avaliação de especialistas, a qualidade da transformação política e
      econômica e da governança. Não é uma API/série temporal ao vivo: os valores do Brasil
      são snapshots transcritos à mão da planilha oficial consolidada BTI 2006–2026 Scores
      (https://bti-project.org/en/downloads) e dos relatórios de país, registrados via
      static_table como um ponto por edição (Jan 1 do ano da edição). O cron diário reemite os
      mesmos valores sem alterá-los; uma nova observação é adicionada quando sai uma nova edição.

  petrobras_ri:
    name: Petrobras — Divulgação de Resultados Anuais (Relações com Investidores)
    institution: Petróleo Brasileiro S.A. (Petrobras)
    url: https://www.investidorpetrobras.com.br/
    license_or_terms: Conteúdo público de divulgação de resultados (companhia aberta B3/NYSE); uso informativo
      com citação da fonte.
    notes: Receita de vendas e lucro líquido consolidados anuais (IFRS) das demonstrações financeiras da
      Petrobras. Sem API pública de série temporal; registrados via static_table e reemitidos sem alteração
      pelo cron diário.
  epe_ben:
    name: Balanço Energético Nacional (BEN) — Relatório Síntese
    institution: Empresa de Pesquisa Energética (EPE) / Ministério de Minas e Energia
    url: https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/balanco-energetico-nacional-2025
    license_or_terms: Publicação oficial de acesso público da EPE (dados abertos governamentais); uso com
      citação da fonte.
    notes: Participação das fontes na matriz elétrica (Oferta Interna de Energia Elétrica), ano base 2024,
      transcrita do BEN 2025 (Relatório Síntese). static_table, um ponto por ano por fonte.
  distrito_vc:
    name: Inside Venture Capital Brasil (Distrito)
    institution: Distrito (plataforma privada de dados de inovação/startups)
    url: https://www.distrito.me/blog/mercado-de-venture-capital-brasil/
    license_or_terms: Dados de mercado divulgados publicamente pela Distrito; fonte privada, não governamental.
    notes: 'NÃO é fonte oficial: não há estatística governamental de venture capital no Brasil. A Distrito
      é o provedor privado mais citado (reproduzido por NeoFeed, IstoÉ Dinheiro, Forbes, Mobile Time). static_table.'
  cetic_tic:
    name: TIC Domicílios — Cetic.br/NIC.br
    institution: Cetic.br / NIC.br / CGI.br
    url: https://cetic.br/pt/tics/domicilios/
    license_or_terms: Dados públicos divulgados pelo Cetic.br/NIC.br; uso com citação da fonte.
    notes: 'Indicador C5 (Comunicação) da TIC Domicílios: proporção de usuários de Internet que enviaram
      mensagens instantâneas (WhatsApp, Telegram e similares). Substitui DAU/MAU oficiais do WhatsApp, inexistentes.
      static_table.'
series:
  - series_id: bcb_sgs_selic_target
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "432"
    name: Selic target set by Copom
    description: Taxa Selic meta definida pelo Copom.
    unit: percent per year
    frequency: daily
    concept: policy rate
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: stock / target rate
    source_url: https://dadosabertos.bcb.gov.br/dataset/432-taxa-de-juros---selic-meta-definida-pelo-copom
    start_date: "1996-01-01"

  - series_id: bcb_sgs_ipca_monthly
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "433"
    name: IPCA monthly variation
    description: Índice Nacional de Preços ao Consumidor Amplo, monthly percent change.
    unit: percent month over month
    frequency: monthly
    concept: consumer inflation
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: monthly flow / percent change
    source_url: https://dadosabertos.bcb.gov.br/dataset/433-indice-nacional-de-precos-ao-consumidor-amplo-ipca
    start_date: "1996-01-01"

  - series_id: bcb_sgs_ipca_12m
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "13522"
    name: IPCA accumulated in 12 months
    description: IPCA accumulated percent change over 12 months.
    unit: percent over 12 months
    frequency: monthly
    concept: consumer inflation
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: accumulated in 12 months
    source_url: https://dadosabertos.bcb.gov.br/dataset/13522-sgs
    start_date: "1996-01-01"

  - series_id: bcb_focus_ipca_12m_ahead
    source_id: bcb_olinda_expectativas
    connector: bcb_olinda_expectativas
    source_series_code: "ExpectativasMercadoInflacao12Meses"
    olinda_resource: ExpectativasMercadoInflacao12Meses
    olinda_indicador: IPCA
    olinda_field: Mediana
    olinda_filters:
      Suavizada: "S"
      baseCalculo: 0
    name: Focus IPCA expectation 12 months ahead (median, smoothed)
    description: >-
      Expectativa de mercado (Focus) para o IPCA acumulado nos próximos 12 meses, mediana
      suavizada (baseCalculo 0). Indicador prospectivo, comparável horizonte a horizonte com
      o IPCA realizado acumulado em 12 meses (SGS 13522). Resamplada para o último boletim de
      cada mês.
    unit: percent over next 12 months
    frequency: monthly
    concept: inflation expectation
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: survey median, smoothed, 12-months-ahead horizon
    scope: Focus survey respondents
    method: BCB Focus / Expectativas de Mercado
    source_url: https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoInflacao12Meses?$format=json&$filter=Indicador%20eq%20'IPCA'
    start_date: "1996-01-01"

  - series_id: bcb_sgs_usd_brl_sale
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "1"
    name: BRL/USD exchange rate, sale
    description: Taxa de câmbio livre, dólar americano venda, daily.
    unit: BRL per USD
    frequency: daily
    concept: exchange rate
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: daily stock / end-of-day quote
    source_url: https://dadosabertos.bcb.gov.br/dataset/1-taxa-de-cambio---livre---dolar-americano-venda---diario
    start_date: "1996-01-01"

  - series_id: ecb_cny_brl
    source_id: ecb
    connector: ecb_fx
    source_series_code: "CNY-BRL"
    ecb_base: CNY
    ecb_quote: BRL
    name: BRL/CNY exchange rate (ECB reference)
    description: Reais por iuan chinês (CNY), taxa de referência diária do BCE.
    unit: BRL per CNY
    frequency: daily
    concept: exchange rate
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: daily stock / ECB reference rate (cross)
    source_url: https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html
    start_date: "2010-01-01"

  - series_id: bcb_sgs_reer_ipca
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "11752"
    name: Real effective exchange rate index (IPCA-deflated)
    description: >-
      Índice da taxa de câmbio efetiva real (cesta de moedas), deflacionado pelo IPCA.
      Base junho/1994 = 100. Valores mais altos indicam moeda mais valorizada em termos reais.
    unit: index, Jun/1994 = 100
    frequency: monthly
    concept: real effective exchange rate
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: index, IPCA-deflated, trade-weighted basket
    scope: Effective (multilateral, currency basket)
    source_url: https://api.bcb.gov.br/dados/serie/bcdata.sgs.11752/dados?formato=json
    start_date: "1996-01-01"

  - series_id: bcb_sgs_pib_monthly_brl
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "4380"
    name: Monthly nominal GDP
    description: PIB mensal em valores correntes estimado pelo Banco Central.
    unit: BRL millions
    frequency: monthly
    concept: nominal GDP
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: monthly nominal value
    source_url: https://www.bcb.gov.br/content/publicacoes/notastecnicas/NT_52_202107.pdf
    start_date: "1996-01-01"

  - series_id: bcb_sgs_ibc_br_sa
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "24364"
    name: IBC-Br index, seasonally adjusted
    description: Índice de Atividade Econômica do Banco Central, com ajuste sazonal.
    unit: index
    frequency: monthly
    concept: activity index
    geography: Brazil
    seasonal_adjustment: seasonally adjusted
    transformation: index
    source_url: https://www.bcb.gov.br/content/ri/relatorioinflacao/202506/rpm202506p.pdf
    start_date: "1996-01-01"

  - series_id: bcb_sgs_ibc_br_nsa
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "24363"
    name: IBC-Br index, not seasonally adjusted
    description: Índice de Atividade Econômica do Banco Central, sem ajuste sazonal (série original). Usado para a variação interanual (12 meses).
    unit: index
    frequency: monthly
    concept: activity index
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: index
    source_url: https://dadosabertos.bcb.gov.br/dataset/24363-indice-de-atividade-economica-do-banco-central---ibc-br
    start_date: "1996-01-01"

  - series_id: bcb_sgs_dbgg_pct_gdp
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "13762"
    name: Gross General Government Debt (DBGG)
    description: Dívida bruta do governo geral, methodology used from 2008.
    unit: percent of GDP
    frequency: monthly
    concept: public debt
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: stock as percent of GDP
    scope: General Government
    source_url: https://dadosabertos.bcb.gov.br/dataset/13762-divida-bruta-do-governo-geral--pib---metodologia-utilizada-a-partir-de-2008
    start_date: "1996-01-01"

  - series_id: bcb_sgs_dlsp_pct_gdp
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "4513"
    name: Net Public Sector Debt (DLSP)
    description: Dívida líquida do setor público consolidado.
    unit: percent of GDP
    frequency: monthly
    concept: public debt
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: stock as percent of GDP
    scope: Consolidated Public Sector
    source_url: https://dadosabertos.bcb.gov.br/dataset/4513-divida-liquida-do-setor-publico--pib---total---setor-publico-consolidado
    start_date: "1996-01-01"

  - series_id: bcb_sgs_nfsp_primary_12m_pct_gdp
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "5793"
    name: NFSP primary result, 12 months
    description: NFSP sem desvalorização cambial, resultado primário, total, setor público consolidado.
    unit: percent of GDP
    frequency: monthly
    concept: primary result below-the-line
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: accumulated in 12 months
    scope: Consolidated Public Sector
    method: below-the-line NFSP
    source_url: https://dadosabertos.bcb.gov.br/dataset/5793-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-primario---tota
    start_date: "1996-01-01"

  - series_id: bcb_sgs_nfsp_nominal_12m_pct_gdp
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "5727"
    name: NFSP nominal result, 12 months
    description: NFSP sem desvalorização cambial, resultado nominal, total, setor público consolidado.
    unit: percent of GDP
    frequency: monthly
    concept: nominal result below-the-line
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: accumulated in 12 months
    scope: Consolidated Public Sector
    method: below-the-line NFSP
    source_url: https://dadosabertos.bcb.gov.br/dataset/5727-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-nominal---total
    start_date: "1996-01-01"

  - series_id: bcb_sgs_nfsp_interest_12m_pct_gdp
    source_id: bcb_sgs
    connector: bcb_sgs
    source_series_code: "5760"
    name: NFSP nominal interest, 12 months
    description: NFSP sem desvalorização cambial, juros nominais, total, setor público consolidado.
    unit: percent of GDP
    frequency: monthly
    concept: nominal interest below-the-line
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: accumulated in 12 months
