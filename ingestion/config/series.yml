      Quantidade mensal de transações Pix liquidadas no SPI (soma dos dias do mês),
      convertida para milhões de transações. Apenas meses completos.
    unit: millions of transactions
    frequency: monthly
    concept: instant-payment transaction count
    geography: Brazil
    seasonal_adjustment: not seasonally adjusted
    transformation: daily count summed to calendar month, in millions
    scope: Pix settled in the SPI
