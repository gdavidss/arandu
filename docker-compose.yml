services:
  metabase_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase
    volumes:
      - metabase_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 5s
      retries: 20

  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiscallens
      POSTGRES_USER: fiscallens
      POSTGRES_PASSWORD: fiscallens
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscallens -d fiscallens"]
      interval: 5s
      timeout: 5s
      retries: 20

  metabase:
    image: metabase/metabase:latest
    depends_on:
      metabase_postgres:
        condition: service_healthy
      warehouse:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase
      MB_DB_HOST: metabase_postgres
      MB_SITE_NAME: arandu.ai
      # Default is 2000 rows, which truncates daily series (Selic/câmbio) and cuts off the
      # most recent years. Raise it so long daily histories render in full.
      MB_UNAGGREGATED_QUERY_ROW_LIMIT: "100000"
      MB_AGGREGATED_QUERY_ROW_LIMIT: "100000"
      # NOTE: OSS Metabase blocks the full app inside iframes (full-app "interactive"
      # embedding is EE-only) and the MB_*_INTERACTIVE env vars kill boot on OSS. So the
      # card-fullscreen modal works by having the frontend proxy patch out Metabase's
      # `window.self !== window.top` self-check in the served JS bundle (see server.mjs),
      # which lets the question view boot inside the modal's iframe.
    ports:
      - "3000:3000"

  ingestion:
    build:
      context: ./ingestion
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      WAREHOUSE_DSN: postgresql://fiscallens:fiscallens@warehouse:5432/fiscallens
      SERIES_CONFIG: /app/config/series.yml
      REFRESH_INTERVAL_HOURS: "24"
      REFRESH_ON_START: "true"
      DASHBOARD_DATA_PATH: /frontend-public/dashboard-data.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ingestion:/app
      - ./warehouse/init:/warehouse-init:ro
      - ./frontend/public:/frontend-public
    command: ["python", "-m", "arandu", "worker"]

  # MCP server — the same warehouse data behind the charts, exposed to any agent
  # (Claude Code, Cursor, …) over streamable HTTP. Read-only. See metasystemic/agent-interface.md.
  mcp:
    build:
      context: ./ingestion
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      WAREHOUSE_DSN: postgresql://fiscallens:fiscallens@warehouse:5432/fiscallens
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8808"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ingestion:/app
    command: ["python", "-m", "arandu.mcp_server"]
    ports:
      - "8808:8808"

  metabase_setup:
    build:
      context: ./ingestion
    depends_on:
      metabase:
        condition: service_started
      warehouse:
        condition: service_healthy
    environment:
      MB_URL: http://metabase:3000
      PUBLIC_METABASE_URL: http://localhost:3000
      MB_EMAIL: admin@fiscallens.local
      MB_PASSWORD: FiscalLensBrasil2026!
      MB_FIRST_NAME: arandu.ai
      MB_LAST_NAME: Admin
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: fiscallens
      WAREHOUSE_USER: fiscallens
      WAREHOUSE_PASSWORD: fiscallens
      METABASE_LINKS_PATH: /frontend-public/metabase-dashboards.json
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./ingestion:/app
      - ./frontend/public:/frontend-public
    command: ["python", "-m", "arandu.metabase_setup"]
    restart: "no"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - metabase
    environment:
      VITE_METABASE_BASE_URL: http://localhost:3000
      METABASE_INTERNAL_URL: http://metabase:3000
      # Server-side session for the editable question view (creds stay out of the browser).
      MB_EMAIL: admin@fiscallens.local
      MB_PASSWORD: FiscalLensBrasil2026!
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-c",
        "npm run build && node server.mjs",
      ]

volumes:
  metabase_postgres_data:
  warehouse_data:
  frontend_node_modules:
